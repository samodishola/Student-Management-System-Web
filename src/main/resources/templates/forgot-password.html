<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .forgot-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .forgot-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #212529;
            font-weight: 700;
        }

        .forgot-card p {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #f8d7da;
            color: #842029;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

    </style>
</head>

<body>

<div class="forgot-card">

    <h2>Forgot Password?</h2>

    <p>
        Enter your matric number and registered email address
        to verify your student account.
    </p>

    <div th:if="${error}" class="error-message">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/forgot-password}" method="post">

        <div class="mb-3">
            <label for="matricNumber" class="form-label">
                Matric Number
            </label>

            <input type="text"
                   id="matricNumber"
                   name="matricNumber"
                   class="form-control"
                   placeholder="Enter your matric number"
                   required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">
                Registered Email
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your registered email"
                   required>
        </div>

        <button type="submit" class="btn btn-primary btn-reset">
            Verify Account
        </button>

    </form>

    <div class="back-login">
        <a th:href="@{/login}">
            ← Back to Login
        </a>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 40px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .welcome h1 {
            color: #1e3a8a;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #1e3a8a;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>Student Management System</h2>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">
            Logout
        </button>
    </form>

</div>

<div class="container">

    <div class="welcome">

        <h1>Welcome to the Dashboard</h1>

        <p>
            You have successfully logged into the Student Management System.
        </p>

    </div>

    <div class="cards">

        <div class="card">
            <h3>Student Management</h3>
            <p>Manage student records.</p>
        </div>

        <div class="card">
            <h3>Student Records</h3>
            <p>View registered students.</p>
        </div>

        <div class="card">
            <h3>System Security</h3>
            <p>Your account is protected by Spring Security.</p>
        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Student Registration - Student Management System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>

    body {
      background: linear-gradient(135deg, #f4f7fb, #e8eef8);
      min-height: 100vh;
    }


    .registration-card {
      border: none;
      border-radius: 15px;
      overflow: hidden;
    }


    .registration-header {
      background: #1e3a8a;
      color: white;
      padding: 30px;
    }


    .registration-header h1 {
      font-size: 30px;
      font-weight: 700;
    }


    .form-label {
      font-weight: 600;
    }


    .required {
      color: #dc2626;
    }


    .register-btn {
      background: #1e3a8a;
      border: none;
      padding: 12px;
      font-weight: 600;
    }


    .register-btn:hover {
      background: #172554;
    }


    .login-link {
      color: #1e3a8a;
      font-weight: 600;
      text-decoration: none;
    }


    .login-link:hover {
      text-decoration: underline;
    }


    /* Back to Main Portal */

    .back-portal {
      text-align: center;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #eeeeee;
    }


    .back-portal a {
      color: #1e3a8a;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }


    .back-portal a:hover {
      text-decoration: underline;
    }


    /* Footer */

    .footer {
      text-align: center;
      margin-top: 25px;
      margin-bottom: 10px;
      color: #777;
      font-size: 13px;
    }


    @media (max-width: 576px) {

      .registration-header {
        padding: 25px 20px;
      }

      .registration-header h1 {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>


<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-9 col-xl-8">

      <div class="card registration-card shadow">


        <!-- =========================
             HEADER
             ========================= -->

        <div class="registration-header text-center">

          <div style="font-size: 42px; margin-bottom: 10px;">
            🎓
          </div>

          <h1>
            Student Registration
          </h1>

          <p class="mb-0">
            Create your student portal account
          </p>

        </div>


        <div class="card-body p-4 p-md-5">


          <!-- Error Message -->

          <div th:if="${error}"
               class="alert alert-danger"
               th:text="${error}">
          </div>


          <!-- =========================
               REGISTRATION FORM
               ========================= -->

          <form th:action="@{/student/register}"
                method="post">


            <!-- Personal Information -->

            <h4 class="mb-4 text-primary">
              Personal Information
            </h4>


            <div class="row g-3">


              <!-- Matric Number -->

              <div class="col-md-6">

                <label class="form-label">

                  Matric Number

                  <span class="required">*</span>

                </label>

                <input
                        type="text"
                        name="matricNumber"
                        class="form-control"
                        placeholder="Enter matric number"
                        required>

              </div>


              <!-- First Name -->

              <div class="col-md-6">

                <label class="form-label">

                  First Name

                  <span class="required">*</span>

                </label>

                <input
                        type="text"
                        name="firstName"
                        class="form-control"
                        placeholder="Enter first name"
                        required>

              </div>


              <!-- Last Name -->

              <div class="col-md-6">

                <label class="form-label">

                  Last Name

                  <span class="required">*</span>

                </label>

                <input
                        type="text"
                        name="lastName"
                        class="form-control"
                        placeholder="Enter last name"
                        required>

              </div>


              <!-- Gender -->

              <div class="col-md-6">

                <label class="form-label">

                  Gender

                  <span class="required">*</span>

                </label>

                <select
                        name="gender"
                        class="form-select"
                        required>

                  <option value="">
                    Select gender
                  </option>

                  <option value="Male">
                    Male
                  </option>

                  <option value="Female">
                    Female
                  </option>

                </select>

              </div>


              <!-- Age -->

              <div class="col-md-6">

                <label class="form-label">

                  Age

                  <span class="required">*</span>

                </label>

                <input
                        type="number"
                        name="age"
                        class="form-control"
                        placeholder="Enter age"
                        min="1"
                        max="100"
                        required>

              </div>


              <!-- Date of Birth -->

              <div class="col-md-6">

                <label class="form-label">

                  Date of Birth

                  <span class="required">*</span>

                </label>

                <input
                        type="date"
                        name="dateOfBirth"
                        class="form-control"
                        required>

              </div>


            </div>


            <!-- =========================
                 ACADEMIC INFORMATION
                 ========================= -->

            <h4 class="mb-4 mt-5 text-primary">
              Academic Information
            </h4>


            <div class="row g-3">


              <!-- Department -->

              <div class="col-md-6">

                <label class="form-label">

                  Department

                  <span class="required">*</span>

                </label>

                <input
                        type="text"
                        name="department"
                        class="form-control"
                        placeholder="e.g. Computer Science"
                        required>

              </div>


              <!-- Faculty -->

              <div class="col-md-6">

                <label class="form-label">

                  Faculty

                  <span class="required">*</span>

                </label>

                <input
                        type="text"
                        name="faculty"
                        class="form-control"
                        placeholder="Enter faculty"
                        required>

              </div>


              <!-- Level -->

              <div class="col-md-6">

                <label class="form-label">

                  Level

                  <span class="required">*</span>

                </label>

                <select
                        name="level"
                        class="form-select"
                        required>

                  <option value="">
                    Select level
                  </option>

                  <option value="ND1">
                    ND1
                  </option>

                  <option value="ND2">
                    ND2
                  </option>

                  <option value="HND1">
                    HND1
                  </option>

                  <option value="HND2">
                    HND2
                  </option>

                </select>

              </div>


              <!-- GPA -->

              <div class="col-md-6">

                <label class="form-label">
                  GPA
                </label>

                <input
                        type="number"
                        name="gpa"
                        class="form-control"
                        placeholder="Enter GPA"
                        min="0"
                        max="4"
                        step="0.01">

              </div>


            </div>


            <!-- =========================
                 CONTACT INFORMATION
                 ========================= -->

            <h4 class="mb-4 mt-5 text-primary">
              Contact Information
            </h4>


            <div class="row g-3">


              <!-- Phone -->

              <div class="col-md-6">

                <label class="form-label">

                  Phone Number

                  <span class="required">*</span>

                </label>

                <input
                        type="tel"
                        name="phoneNumber"
                        class="form-control"
                        placeholder="Enter phone number"
                        required>

              </div>


              <!-- Email -->

              <div class="col-md-6">

                <label class="form-label">

                  Email Address

                  <span class="required">*</span>

                </label>

                <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter email address"
                        required>

              </div>


              <!-- Address -->

              <div class="col-12">

                <label class="form-label">

                  Address

                  <span class="required">*</span>

                </label>

                <textarea
                        name="address"
                        class="form-control"
                        rows="3"
                        placeholder="Enter your address"
                        required></textarea>

              </div>


            </div>


            <!-- =========================
                 ACCOUNT INFORMATION
                 ========================= -->

            <h4 class="mb-4 mt-5 text-primary">
              Account Information
            </h4>


            <div class="row g-3">


              <!-- Password -->

              <div class="col-md-6">

                <label class="form-label">

                  Password

                  <span class="required">*</span>

                </label>

                <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a password"
                        minlength="6"
                        required>

              </div>


              <!-- Confirm Password -->

              <div class="col-md-6">

                <label class="form-label">

                  Confirm Password

                  <span class="required">*</span>

                </label>

                <input
                        type="password"
                        name="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

              </div>


            </div>


            <!-- =========================
                 SUBMIT
                 ========================= -->

            <div class="mt-5">

              <button
                      type="submit"
                      class="btn btn-primary register-btn w-100">

                Create Student Account

              </button>

            </div>


            <!-- =========================
                 LOGIN LINK
                 ========================= -->

            <div class="text-center mt-4">

              <span class="text-muted">

                Already have an account?

              </span>

              <a
                      href="/login"
                      class="login-link">

                Login

              </a>

            </div>


            <!-- =========================
                 BACK TO MAIN PORTAL
                 ========================= -->

            <div class="back-portal">

              <a href="/">

                ← Back to Main Portal

              </a>

            </div>


          </form>


          <!-- Footer -->

          <div class="footer">

            Student Management System © 2026

          </div>


        </div>

      </div>

    </div>

  </div>

</div>


</body>

</html>

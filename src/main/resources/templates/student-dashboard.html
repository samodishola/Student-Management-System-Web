<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .dashboard-title {
            font-weight: 700;
            color: #1f3c88;
        }

        .profile-card {
            border: none;
            border-radius: 15px;
        }

        .profile-header {
            background: #1f3c88;
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 25px;
        }

        .profile-header h3 {
            margin-bottom: 5px;
        }

        .info-label {
            font-weight: 600;
            color: #555;
        }

        .info-value {
            color: #222;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            Student Management System
        </span>

        <div class="d-flex align-items-center gap-2">

            <!-- Main Portal -->
            <a href="/" class="btn btn-outline-light">
                🌐 Main Portal
            </a>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light">
                    Logout
                </button>
            </form>

        </div>

    </div>
</nav>


<!-- Main Content -->
<div class="container mt-5">

    <div class="mb-4">

        <h1 class="dashboard-title">
            Student Dashboard
        </h1>

        <p class="text-muted">
            View your personal academic information.
        </p>

    </div>


    <!-- Student Profile -->
    <div class="card profile-card shadow-sm">

        <div class="profile-header">

            <h3>
                <span th:text="${student.firstName}"></span>
                <span th:text="${student.lastName}"></span>
            </h3>

            <p class="mb-0">
                Student Profile
            </p>

        </div>


        <div class="card-body p-4">

            <div class="row g-4">

                <!-- Matric Number -->
                <div class="col-md-6">
                    <div class="info-label">
                        Matric Number
                    </div>

                    <div class="info-value"
                         th:text="${student.matricNumber}">
                    </div>
                </div>


                <!-- Gender -->
                <div class="col-md-6">
                    <div class="info-label">
                        Gender
                    </div>

                    <div class="info-value"
                         th:text="${student.gender}">
                    </div>
                </div>


                <!-- Age -->
                <div class="col-md-6">
                    <div class="info-label">
                        Age
                    </div>

                    <div class="info-value"
                         th:text="${student.age}">
                    </div>
                </div>


                <!-- Date of Birth -->
                <div class="col-md-6">
                    <div class="info-label">
                        Date of Birth
                    </div>

                    <div class="info-value"
                         th:text="${student.dateOfBirth}">
                    </div>
                </div>


                <!-- Department -->
                <div class="col-md-6">
                    <div class="info-label">
                        Department
                    </div>

                    <div class="info-value"
                         th:text="${student.department}">
                    </div>
                </div>


                <!-- Faculty -->
                <div class="col-md-6">
                    <div class="info-label">
                        Faculty
                    </div>

                    <div class="info-value"
                         th:text="${student.faculty}">
                    </div>
                </div>


                <!-- Level -->
                <div class="col-md-6">
                    <div class="info-label">
                        Level
                    </div>

                    <div class="info-value"
                         th:text="${student.level}">
                    </div>
                </div>


                <!-- GPA -->
                <div class="col-md-6">
                    <div class="info-label">
                        GPA
                    </div>

                    <div class="info-value"
                         th:text="${student.gpa}">
                    </div>
                </div>


                <!-- Phone -->
                <div class="col-md-6">
                    <div class="info-label">
                        Phone Number
                    </div>

                    <div class="info-value"
                         th:text="${student.phoneNumber}">
                    </div>
                </div>


                <!-- Email -->
                <div class="col-md-6">
                    <div class="info-label">
                        Email
                    </div>

                    <div class="info-value"
                         th:text="${student.email}">
                    </div>
                </div>


                <!-- Address -->
                <div class="col-12">
                    <div class="info-label">
                        Address
                    </div>

                    <div class="info-value"
                         th:text="${student.address}">
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
